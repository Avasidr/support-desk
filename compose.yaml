services:
  postgres:
    image: postgres:17
    container_name: support-desk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: support_desk
      POSTGRES_USER: support_desk
      POSTGRES_PASSWORD: support_desk

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_desk -d support_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
